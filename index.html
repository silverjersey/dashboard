<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EEE6">
<title>Silver Jersey Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-sauce-one@5/300.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-sauce-one@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-sauce-one@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-sauce-one@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/open-sauce-one@5/700.css">
<style>
:root{
  --bg:#F2EEE6; --bg2:#EAE5DB; --card:#FFFFFF; --soft:#F8F6F1; --soft2:#F1EDE5;
  --ink:#151515; --ink2:#5F5B54; --ink3:#A39E95;
  --line:rgba(21,21,21,.07); --line2:rgba(21,21,21,.13);
  --ok:#16A34A; --warn:#DD8A0C; --bad:#E5484D;
  --r:24px; --r2:18px; --r3:13px; --r4:10px;
  --sh:0 1px 2px rgba(40,30,10,.04),0 10px 30px -14px rgba(40,30,10,.14);
  --sh2:0 2px 6px rgba(40,30,10,.05),0 24px 50px -18px rgba(40,30,10,.26);
  --side:250px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{color:var(--ink);font-family:'Open Sauce Sans','Open Sauce One',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{min-height:100vh;background:radial-gradient(1100px 560px at 100% -8%,#F7E6D2 0,rgba(247,230,210,0) 60%),radial-gradient(900px 520px at -8% 108%,#E3E7F2 0,rgba(227,231,242,0) 55%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
input[type=date],input[type=time]{min-height:20px}
::selection{background:#151515;color:#fff}
.i{flex-shrink:0;display:block}

/* ---------- shell ---------- */
#app{display:flex;min-height:100vh}
#side{width:var(--side);flex-shrink:0;position:sticky;top:0;height:100vh;padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;scrollbar-width:none}
#side::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 18px}
.logo{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:-.03em;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.brand b{display:block;font-size:14px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
.search-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:0 2px 12px;border-radius:14px;background:rgba(255,255,255,.65);color:var(--ink3);font-size:13px;box-shadow:inset 0 0 0 1px var(--line)}
.search-btn:hover{background:#fff;color:var(--ink2)}
.search-btn span{flex:1;text-align:left}
kbd{font:500 10.5px/1 inherit;padding:4px 6px;border-radius:6px;background:var(--soft2);color:var(--ink3)}
.nav-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding:12px 12px 6px;font-weight:500}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:13px;color:var(--ink2);font-size:13.5px;transition:background .15s,color .15s}
.nav:hover{background:rgba(255,255,255,.55);color:var(--ink)}
.nav.on{background:#fff;color:var(--ink);font-weight:500;box-shadow:var(--sh)}
.nav .i{opacity:.7}.nav.on .i{opacity:1}
.nav .bdg{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center}
.nav .bdg.bad{background:var(--bad)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px}
.sync{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3);padding:0 12px}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.sync.ok .dot{background:var(--ok)} .sync.err .dot{background:var(--bad)} .sync.busy .dot{background:var(--warn);animation:pulse 1s infinite}
.sync.local .dot{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:16px;background:#fff;box-shadow:var(--sh);position:relative}
.me-name{flex:1;font-size:13px;font-weight:500;line-height:1.25}
.me-name small{display:block;font-size:11px;color:var(--ink3);font-weight:400}
.me select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

#main{flex:1;min-width:0;padding:30px 36px 110px}
.wrap{max-width:1320px;margin:0 auto}

/* mobile */
#tabbar{display:none}
#drawer-bg{display:none}
@media (max-width:960px){
  #side{position:fixed;inset:0 auto 0 0;z-index:90;background:var(--bg);transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--sh2)}
  #side.open{transform:none}
  #drawer-bg.show{display:block;position:fixed;inset:0;background:rgba(20,20,20,.25);z-index:89;backdrop-filter:blur(2px)}
  #main{padding:20px 16px 120px}
  #tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:80;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;box-shadow:var(--sh2);padding:6px;justify-content:space-around}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:16px;font-size:10.5px;color:var(--ink3)}
  .tab.on{color:var(--ink)}
  .tab.fab{flex:0 0 52px}
  .tab.fab span{display:none}
  .tab.fab .fabdot{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
}

/* ---------- head ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.h-eyebrow{font-size:12px;color:var(--ink3);margin-bottom:4px}
.h-title{font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.05}
.h-sub{font-size:13.5px;color:var(--ink2);margin-top:6px}
.h-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;transition:transform .12s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn-dark{background:var(--ink);color:#fff;box-shadow:0 6px 16px -8px rgba(0,0,0,.6)}
.btn-dark:hover{background:#000}
.btn-light{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.btn-light:hover{background:var(--soft)}
.btn-ghost{color:var(--ink2)}
.btn-ghost:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.btn-bad{color:var(--bad)}
.btn-bad:hover{background:rgba(229,72,77,.08)}
.btn-sm{padding:6px 12px;font-size:12px}
.ibtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:background .15s}
.ibtn:hover{background:rgba(255,255,255,.8);color:var(--ink)}
.ibtn.sm{width:28px;height:28px}
.fab-top{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.6);transition:transform .15s}
.fab-top:hover{transform:translateY(-1px) rotate(90deg)}

.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px var(--line);gap:2px}
.seg button{padding:6px 14px;border-radius:999px;font-size:12.5px;color:var(--ink2);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--ink);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;color:var(--ink2);background:rgba(255,255,255,.65);box-shadow:inset 0 0 0 1px var(--line);font-weight:500;white-space:nowrap}
.chip:hover{background:#fff;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:7px;font-size:11px;font-weight:500;white-space:nowrap;background:var(--soft2);color:var(--ink2)}
.dotc{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}

/* ---------- avatars ---------- */
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:600;flex-shrink:0;letter-spacing:-.02em;box-shadow:0 0 0 2px #fff}
.av.s{width:20px;height:20px;font-size:9.5px}
.av.l{width:36px;height:36px;font-size:13.5px}
.av.none{background:var(--soft2)!important;color:var(--ink3)}
.avs{display:inline-flex}.avs .av+.av{margin-left:-6px}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px 24px;position:relative}
.card.flat{box-shadow:none;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px var(--line)}
.c-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.c-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
.c-sub{font-size:12px;color:var(--ink3)}
.c-link{font-size:12px;color:var(--ink3);font-weight:500;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.c-link:hover{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:1180px){.s3{grid-column:span 6}.s4,.s5,.s7,.s8{grid-column:span 12}.s6{grid-column:span 12}}
@media (max-width:640px){.s3{grid-column:span 12}.grid{gap:14px}.card{padding:18px}}
.empty{padding:18px 4px;text-align:center;color:var(--ink3);font-size:13px}
.muted{color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px}

/* ---------- home ---------- */
.hero{border-radius:28px;padding:30px 32px;min-height:236px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative;box-shadow:var(--sh);background:#fff;cursor:pointer;transition:transform .2s,box-shadow .2s}
.hero:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.hero .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;pointer-events:none}
.hero-top{display:flex;justify-content:space-between;gap:20px;position:relative}
.hero-kicker{font-size:12px;font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:8px}
.hero-name{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.02;margin-top:10px;max-width:460px}
.hero-meta{font-size:13.5px;color:var(--ink2);margin-top:8px}
.hero-count{text-align:right}
.hero-num{font-size:72px;font-weight:600;letter-spacing:-.05em;line-height:.9}
.hero-numl{font-size:12px;color:var(--ink2);margin-top:8px}
.hero-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px;position:relative}
.mbar-l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:6px}
.mbar-l b{font-weight:600;color:var(--ink)}
.mbar{height:6px;border-radius:6px;background:rgba(21,21,21,.08);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:6px;background:var(--ink)}
@media (max-width:640px){.hero,.evhero{padding:22px}.hero-name{font-size:26px}.hero-num{font-size:46px;white-space:nowrap}.hero-top,.evh-in{flex-direction:column-reverse;gap:10px}.hero-count{text-align:left;display:flex;align-items:baseline;gap:10px}.hero-numl{margin:0}.hero-bars{grid-template-columns:1fr}.rings{gap:14px}}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%}
.kpi{background:#fff;border-radius:22px;padding:18px 20px;box-shadow:var(--sh);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;min-height:110px;transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi-top{display:flex;justify-content:space-between;align-items:center;color:var(--ink3);font-size:12px}
.kpi-ic{width:30px;height:30px;border-radius:50%;background:var(--soft2);display:grid;place-items:center;color:var(--ink2)}
.kpi-num{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1;margin-top:12px}
.kpi-l{font-size:12.5px;color:var(--ink2);margin-top:4px}
.kpi.dark{background:var(--ink);color:#fff}
.kpi.dark .kpi-top,.kpi.dark .kpi-l{color:rgba(255,255,255,.6)}
.kpi.dark .kpi-ic{background:rgba(255,255,255,.12);color:#fff}
.kpi.alert .kpi-num{color:var(--bad)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.wday{border-radius:18px;padding:12px 10px 10px;background:var(--soft);min-height:150px;display:flex;flex-direction:column;gap:5px;cursor:pointer;transition:background .15s}
.wday:hover{background:var(--soft2)}
.wday.today{background:var(--ink);color:#fff}
.wday.today .wd-n{color:rgba(255,255,255,.55)}
.wd-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.wd-d{font-size:20px;font-weight:600;letter-spacing:-.02em}
.wd-n{font-size:11px;color:var(--ink3);text-transform:capitalize}
.witem{font-size:11.5px;line-height:1.3;padding:5px 7px;border-radius:9px;background:#fff;color:var(--ink);display:flex;gap:6px;align-items:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.wday.today .witem{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.witem span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.witem .dotc{margin-top:4px}
@media (max-width:900px){.week{grid-template-columns:repeat(7,minmax(118px,1fr));overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}.wday{scroll-snap-align:start}}

.lines{display:flex;flex-direction:column}
.ln{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.ln:last-child{border-bottom:0}
.ln-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln-m{font-size:12px;color:var(--ink3);white-space:nowrap}
.ln-m.bad{color:var(--bad);font-weight:500}.ln-m.warn{color:var(--warn);font-weight:500}
.stack{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--soft2);margin:6px 0 14px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.lg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.lg b{margin-left:auto;color:var(--ink);font-weight:600}

/* ---------- checkbox ---------- */
.ck{width:19px;height:19px;border-radius:7px;box-shadow:inset 0 0 0 1.6px var(--line2);display:grid;place-items:center;flex-shrink:0;transition:all .15s;background:#fff}
.ck:hover{box-shadow:inset 0 0 0 1.6px var(--ink)}
.ck.on{background:var(--ink);box-shadow:none}
.ck.on::after{content:'';width:9px;height:5px;border-left:1.8px solid #fff;border-bottom:1.8px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.ck.half{box-shadow:inset 0 0 0 1.6px var(--warn)}
.ck.half::after{content:'';width:7px;height:7px;border-radius:2px;background:var(--warn)}

/* ---------- quick add ---------- */
.qa{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:6px 6px 6px 14px;box-shadow:var(--sh)}
.qa input{flex:1;min-width:0;padding:8px 0;font-size:13.5px}
.qa input::placeholder{color:var(--ink3)}
.qa-preview{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:0}
.qa.inline{box-shadow:inset 0 0 0 1px var(--line);background:var(--soft)}

/* ---------- calendar ---------- */
.calbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.calnav{display:flex;align-items:center;gap:4px}
.calmonth{font-size:22px;font-weight:600;letter-spacing:-.02em;padding:0 8px;min-width:200px;text-transform:capitalize}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.cal{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.cal-wk{display:grid;grid-template-columns:repeat(7,1fr);padding:12px 0 8px}
.cal-wk div{padding:0 12px;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(118px,auto);border-top:1px solid var(--line)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 7px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:background .12s;min-width:0;position:relative}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--soft)}
.cell.other{background:rgba(242,238,230,.35)}
.cell.other .dn{opacity:.4}
.cell.over{background:#EEF2FF;box-shadow:inset 0 0 0 2px #221FFF}
.cell.gap::before{content:'';position:absolute;inset:3px;border-radius:12px;box-shadow:inset 0 0 0 1.5px rgba(221,138,12,.55);pointer-events:none}
.dn{font-size:12.5px;font-weight:500;color:var(--ink2);width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.today .dn{background:var(--ink);color:#fff;font-weight:600}
.cell-top{display:flex;align-items:center;justify-content:space-between}
.gapflag{font-size:10px;color:var(--warn);font-weight:500}
.pill{font-size:11.5px;line-height:1.3;padding:4px 8px;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;cursor:grab;display:flex;align-items:center;gap:5px;transition:opacity .12s,transform .12s}
.pill:hover{transform:translateY(-1px)}
.pill.ev{cursor:pointer;font-weight:600}
.pill.done{opacity:.5;text-decoration:line-through}
.pill.dragging{opacity:.3}
.pill .chl{font-size:9.5px;opacity:.7;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pill-more{font-size:11px;color:var(--ink3);padding:1px 6px;font-weight:500}
.ext{font-size:10.5px;color:var(--ink3);margin-top:auto;padding:3px 4px 0;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ext i{width:6px;height:6px;border-radius:2px;flex-shrink:0;transform:rotate(45deg)}
@media (max-width:900px){
  .cal-g{grid-auto-rows:minmax(74px,auto)}
  .cell{padding:4px 3px}
  .pill{font-size:10px;padding:2px 4px;border-radius:6px}
  .pill .chl{display:none}
  .ext span{display:none}
  .calmonth{font-size:18px;min-width:150px}
  .cal-wk div{padding:0 4px;font-size:10px}
}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:rgba(255,255,255,.5);border-radius:var(--r);padding:12px;min-height:300px;box-shadow:inset 0 0 0 1px var(--line);transition:background .15s}
.col.over{background:rgba(255,255,255,.95);box-shadow:inset 0 0 0 2px var(--ink)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 12px;font-size:13px;font-weight:600}
.col-h .n{margin-left:auto;color:var(--ink3);font-weight:500;font-size:12px}
.bcard{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh);margin-bottom:10px;cursor:grab;display:flex;flex-direction:column;gap:8px;transition:transform .12s}
.bcard:hover{transform:translateY(-2px)}
.bcard.dragging{opacity:.35}
.bcard-img{width:100%;aspect-ratio:4/3;border-radius:11px;object-fit:cover;background:var(--soft2);display:block}
.bcard-t{font-size:13px;font-weight:500;line-height:1.35}
.bcard-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3)}
.bcard-m .av{margin-left:auto}
.lintw{color:var(--warn);display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:500}

/* ---------- timeline ---------- */
.tl-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;margin-bottom:16px}
.sim{flex:1;min-width:300px;background:#fff;border-radius:var(--r2);box-shadow:var(--sh);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sim-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sim-row .f{padding:7px 10px;border-radius:10px;background:var(--soft);font-size:13px}
.sim-out{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.sim-out .w{color:var(--warn)}.sim-out .b{color:var(--bad)}.sim-out .g{color:var(--ok)}
.tl{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.tl-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.tl-in{position:relative}
.tl-months{display:flex;height:42px;border-bottom:1px solid var(--line);position:relative}
.tl-lab{position:sticky;left:0;z-index:6;width:200px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:0 16px;font-size:13px;font-weight:500;overflow:hidden}
.tl-lab small{font-size:11px;color:var(--ink3);font-weight:400;white-space:nowrap}
.tl-lab.h{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.tl-m{flex-shrink:0;display:flex;align-items:center;padding:0 10px;font-size:12px;color:var(--ink2);font-weight:500;border-left:1px solid var(--line);text-transform:capitalize}
.tl-row{display:flex;height:50px;border-bottom:1px solid var(--line);position:relative}
.tl-row:last-child{border-bottom:0}
.tl-row.load{height:34px;background:var(--soft)}
.tl-row.load .tl-lab{background:var(--soft)}
.tl-row.ghost{background:repeating-linear-gradient(-45deg,rgba(21,21,21,.025) 0 8px,transparent 8px 16px)}
.tl-track{position:relative;flex-shrink:0}
.tl-bar{position:absolute;top:50%;transform:translateY(-50%);height:26px;border-radius:9px;display:flex;align-items:center;padding:0 10px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;cursor:pointer}
.tl-bar.g{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--ink);border-style:dashed}
.tl-dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.25);cursor:pointer;z-index:3}
.tl-tick{position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%;transform:translateX(-50%);z-index:2}
.tl-vl{position:absolute;top:42px;bottom:0;width:1px;pointer-events:none;z-index:1}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:5;pointer-events:none}
.tl-today::before{content:'';position:absolute;top:4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.tl-load{position:absolute;top:9px;height:16px;border-radius:5px}
.tl-x{position:absolute;top:50%;width:11px;height:11px;transform:translate(-50%,-50%) rotate(45deg);border-radius:3px;cursor:default;z-index:2}
.tl-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:14px 4px 0}
.tl-legend span{display:inline-flex;align-items:center;gap:7px}
.lgb{width:22px;height:10px;border-radius:4px}

/* ---------- feed ---------- */
.feedwrap{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1000px){.feedwrap{grid-template-columns:1fr}}
.phone{background:#fff;border-radius:36px;padding:18px 14px 14px;box-shadow:var(--sh2);max-width:440px;width:100%;margin:0 auto}
.ph-head{display:flex;align-items:center;gap:14px;padding:4px 6px 14px}
.ph-av{width:62px;height:62px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#221FFF,#FF1F9F,#FFA617,#221FFF)}
.ph-av div{width:100%;height:100%;border-radius:50%;background:var(--ink);border:3px solid #fff;color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.ph-stats{display:flex;gap:18px;flex:1;justify-content:space-around;text-align:center}
.ph-stats b{display:block;font-size:16px;font-weight:600}
.ph-stats span{font-size:11.5px;color:var(--ink2)}
.ph-name{padding:0 6px 12px;font-size:13px}
.ph-name b{font-weight:600}
.ph-tabs{display:flex;border-top:1px solid var(--line);margin-bottom:2px}
.ph-tabs button{flex:1;padding:10px 0;font-size:12px;color:var(--ink3);font-weight:500;border-top:1.5px solid transparent;margin-top:-1px}
.ph-tabs button.on{color:var(--ink);border-top-color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border-radius:0 0 22px 22px;overflow:hidden}
.fc{aspect-ratio:3/4;background:var(--soft2);position:relative;overflow:hidden;cursor:pointer}
.fc img{width:100%;height:100%;object-fit:cover;display:block}
.fc.ph{background:repeating-linear-gradient(45deg,var(--soft) 0 8px,var(--soft2) 8px 16px);cursor:default}
.fc.nov{display:flex;flex-direction:column;justify-content:flex-end;padding:9px;background:var(--soft)}
.fc.nov .t{font-size:11px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.fc .badge{position:absolute;top:6px;left:6px;font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.92);color:var(--ink)}
.fc .pinb{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.fc.up::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 2px rgba(21,21,21,.5);pointer-events:none}
.fc .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),transparent 55%);opacity:0;transition:opacity .15s;color:#fff;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:500}
.fc:hover .ov{opacity:1}

/* ---------- events ---------- */
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.evc{border-radius:24px;background:#fff;box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
.evc:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.evc-top{height:112px;position:relative;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start;overflow:hidden}
.evc-top .blob{position:absolute;border-radius:50%;filter:blur(30px);opacity:.7}
.evc-j{position:relative;font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1}
.evc-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.evc-n{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.evc-m{font-size:12.5px;color:var(--ink2)}
.evc.past{opacity:.55;filter:grayscale(1)}
.evc.past:hover{opacity:.8}
.evhero.past .blob{filter:blur(46px) grayscale(1);opacity:.35}
.evhero.past .hero-num{color:var(--ink3)}

/* event page */
.evhero{border-radius:30px;padding:28px 30px;position:relative;overflow:hidden;box-shadow:var(--sh);background:#fff;margin-bottom:18px}
.evhero .blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.6;pointer-events:none}
.evh-in{position:relative;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.rings{display:flex;gap:18px;margin-top:22px;position:relative;flex-wrap:wrap}
.ring{display:flex;align-items:center;gap:10px}
.ring-c{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring-c::before{content:'';position:absolute;inset:5px;border-radius:50%;background:#fff}
.ring-c b{position:relative;font-size:11px;font-weight:600}
.ring-l{font-size:12px;color:var(--ink2);line-height:1.3}
.ring-l b{display:block;color:var(--ink);font-size:13.5px;font-weight:600}
.crow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:13px;border-radius:10px}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--soft)}
.crow-d{width:62px;flex-shrink:0;font-size:12px;color:var(--ink2);font-weight:500}
.crow-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.mini-sel{padding:4px 8px;border-radius:8px;background:var(--soft2);font-size:11.5px;font-weight:500;cursor:pointer;max-width:120px}
.cl-row{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:13px;border-radius:10px}
.cl-row:hover{background:var(--soft)}
.cl-row .x{opacity:0;margin-left:auto}
.cl-row:hover .x{opacity:1}
.cl-row.done span{color:var(--ink3);text-decoration:line-through}
.area{width:100%;min-height:90px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:13px;line-height:1.55;resize:vertical}
.area:focus{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line2)}

/* ---------- sponsors ---------- */
.kpirow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media (max-width:900px){.kpirow{grid-template-columns:1fr 1fr}}
.spills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.spill{display:inline-flex;align-items:center;gap:9px;padding:9px 16px 9px 12px;border-radius:999px;background:#fff;box-shadow:var(--sh);font-size:13px;font-weight:500;cursor:pointer;transition:transform .15s}
.spill:hover{transform:translateY(-2px)}
.col.lieux{background:rgba(223,222,217,.55)}
.col.lieux .col-h svg{opacity:.6}
.pipe{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.scard{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:10px;cursor:grab;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.scard:hover{transform:translateY(-2px)}
.scard.dragging{opacity:.35}
.scard-n{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.scard-m{font-size:11.5px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prog{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.prog .mbar{flex:1;height:4px}

/* ---------- tasks ---------- */
.tgroup{margin-bottom:22px}
.tg-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3);font-weight:500;padding:0 6px 8px;text-transform:uppercase;letter-spacing:.07em}
.tg-h .n{text-transform:none;letter-spacing:0}
.tg-h.bad{color:var(--bad)}
.trow{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:16px;background:#fff;box-shadow:var(--sh);margin-bottom:7px;transition:transform .12s}
.trow:hover{transform:translateX(2px)}
.trow .ck{margin-top:1px}
.tb{flex:1;min-width:0;cursor:pointer}
.tt{font-size:13.5px}
.tt.done{color:var(--ink3);text-decoration:line-through}
.tm{display:flex;gap:6px 12px;align-items:center;margin-top:6px;font-size:12px;color:var(--ink3);flex-wrap:wrap}
.tm > span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tm .tag{font-size:11px;padding:3px 9px}
.tm svg{flex-shrink:0}
.tm .bad{color:var(--bad);font-weight:500}

/* ---------- PV ---------- */
.pvlist{display:flex;flex-direction:column;gap:8px}
.pinb{opacity:.35}
.cl-row:hover .pinb,.pvt:hover .pinb{opacity:.8}
.pinb.on{opacity:1;color:var(--ink);background:var(--soft2)}
.mn-menu{position:fixed;z-index:300;background:#fff;border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.04);padding:5px;min-width:170px}
.mn-i{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer}
.mn-i.on,.mn-i:hover{background:var(--soft)}
.ds-th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin:14px 0 4px}
.ds-th:first-of-type{margin-top:2px}
.cl-row.ds span:nth-child(2){flex:1}
.oldv{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.pvr{display:flex;align-items:center;gap:16px;padding:16px 20px;background:#fff;border-radius:18px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s}
.pvr:hover{transform:translateY(-2px)}
.pvr-d{width:56px;height:56px;border-radius:16px;background:var(--soft2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.pvr-d b{font-size:19px;font-weight:600;line-height:1}
.pvr-d span{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.pvr-t{flex:1;min-width:0}
.pvr-t b{font-size:14.5px;font-weight:600;display:block}
.pvr-t span{font-size:12px;color:var(--ink3)}
.search{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#fff;box-shadow:var(--sh);min-width:240px;color:var(--ink3)}
.search input{flex:1;font-size:13px;color:var(--ink)}
.pv-title{font-size:26px;font-weight:600;letter-spacing:-.02em;width:100%;padding:6px 0}
.pv-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 18px}
.pv-meta .f{padding:7px 12px;border-radius:999px;background:#fff;box-shadow:var(--sh);font-size:12.5px}
.pchip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;background:#fff;box-shadow:var(--sh);font-size:12.5px;font-weight:500;cursor:pointer;opacity:.5;transition:opacity .15s}
.pchip.on{opacity:1}
.pv-body{width:100%;min-height:380px;padding:22px 24px;border-radius:22px;background:#fff;box-shadow:var(--sh);font-size:14px;line-height:1.7;resize:vertical}
.pv-hint{font-size:12px;color:var(--ink3);margin:8px 6px 0}
.pv-ed{position:relative;background:#fff;border-radius:22px;box-shadow:var(--sh)}
.pv-ed .pv-body,.pv-hl{font-family:inherit;font-size:14px;line-height:1.7;padding:22px 24px;letter-spacing:normal;word-spacing:normal;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4}
.pv-ed .pv-body{position:relative;z-index:1;display:block;background:transparent;box-shadow:none;color:transparent;caret-color:var(--ink);overflow:hidden;resize:none;border-radius:22px}
.pv-ed .pv-body::placeholder{color:var(--ink3)}
.pv-ed .pv-body::selection{background:rgba(34,31,255,.18);color:transparent}
.pv-hl{position:absolute;inset:0;color:var(--ink);pointer-events:none;overflow:hidden}
.hl-h{display:inline-block;width:100%;background:var(--soft2);border-radius:7px;box-shadow:-8px 0 0 var(--soft2),8px 0 0 var(--soft2);color:var(--ink);letter-spacing:normal}
.hl-m{background:rgba(34,31,255,.1);color:#221FFF;border-radius:4px}
.hl-a{color:#221FFF}
.hl-e{border-radius:4px}
.pvv .hl-e{border-radius:5px;font-weight:500}
#pvt-list .pvt.isdone .d{color:var(--ink3);text-decoration:line-through}
.pvv{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:26px 30px;min-height:380px;font-size:14px;line-height:1.6}
.pvv section{margin-bottom:22px}
.pvv h4{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin:0 0 8px}
.pvv ul{margin:0;padding:0;list-style:none}
.pvv li{position:relative;padding:5px 0 5px 18px;border-bottom:1px solid var(--line, rgba(0,0,0,.05))}
.pvv li:last-child{border-bottom:0}
.pvv li:before{content:'';position:absolute;left:3px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.pvv li b{font-weight:600}
.pvv-t{background:var(--soft);border-radius:18px;padding:16px 18px}
.pvv-p{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.pvv-p + .pvv-p{border-top:1px solid rgba(0,0,0,.05)}
.pvv-p b{font-size:13px;display:block;margin-bottom:2px}
.pvv-l{font-size:13.5px;display:flex;gap:10px;justify-content:space-between;padding:2px 0}
.pvv-l span{color:var(--ink3);font-size:12px;white-space:nowrap}
.pvv-l em{font-style:normal;color:var(--ink3);font-size:12.5px}
.tm .avs{display:inline-flex}.tm .avs .av + .av{margin-left:-5px;box-shadow:0 0 0 2px #fff}
.pvt-who{padding:4px 6px;border-radius:9px;background:#fff;font-size:12px;font-weight:600;max-width:92px}
.pvt-who.none{color:var(--warn);box-shadow:inset 0 0 0 1px rgba(221,138,12,.45)}
.pvt.todo{background:rgba(221,138,12,.08)}
#pvt-list .pvt{flex-wrap:wrap;row-gap:6px}
#pvt-list .pvt .d{order:-1;flex:1 1 100%;line-height:1.4}
#pvt-list .pvt .src{margin-left:auto}
.tl-bar{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvt{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;background:var(--soft);font-size:13px;margin-bottom:6px}
.pvt .d{flex:1;min-width:0}
.pvt small{color:var(--ink3);font-size:11.5px;white-space:nowrap}
.pvt .src{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.pvb{display:grid;grid-template-columns:1fr 1fr 36px;gap:6px;margin-top:8px}
.pvb input[name=pvt-text]{grid-column:1/-1;order:-1}
.pvb select,.pvb input{padding:8px 10px;border-radius:10px;background:var(--soft);font-size:12.5px;min-width:0}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row input[type=text],.set-row input[type=date],.set-row input[type=number],.set-row select{padding:7px 10px;border-radius:10px;background:var(--soft);font-size:13px;min-width:0}
.set-row input[type=color]{width:30px;height:30px;border-radius:50%;padding:0;overflow:hidden;cursor:pointer;border:0;-webkit-appearance:none;appearance:none;background:none}
.set-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.set-row input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
pre.code{background:var(--ink);color:#EDEAE3;padding:14px 16px;border-radius:14px;font-size:11.5px;line-height:1.6;overflow-x:auto;white-space:pre}
.stat{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--soft)}

/* ---------- modal ---------- */
.mbg{position:fixed;inset:0;z-index:200;background:rgba(25,22,18,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(12px) scale(.98);opacity:0}}
.mod{background:#fff;border-radius:28px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh2);animation:up .2s ease}
.mod.wide{max-width:860px}
.m-h{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 6px}
.m-t{font-size:12px;color:var(--ink3);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
.m-b{padding:8px 26px 20px}
.m-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 20px 18px 26px;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:#fff;border-radius:0 0 28px 28px}
.m-f>div{display:flex;gap:6px;flex-wrap:wrap}
.big{width:100%;font-size:22px;font-weight:600;letter-spacing:-.02em;padding:6px 0 10px}
.big::placeholder{color:var(--ink3)}
.fg{margin-bottom:14px}
.fl{display:block;font-size:11.5px;color:var(--ink2);font-weight:500;margin-bottom:6px}
.fi{width:100%;padding:10px 13px;border-radius:13px;background:var(--soft);font-size:13.5px;transition:box-shadow .15s,background .15s}
.fi:focus{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink)}
textarea.fi{min-height:80px;resize:vertical;line-height:1.55}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mcols{display:grid;grid-template-columns:1fr 300px;gap:24px}
@media (max-width:760px){.mcols{grid-template-columns:1fr}.f3{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.f2{grid-template-columns:1fr}.mbg{padding:0;align-items:flex-end}.mod{border-radius:28px 28px 0 0;max-height:94vh}.m-f{border-radius:0}}
.opts{display:flex;gap:6px;flex-wrap:wrap}

const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }

const Store = {
  mode: 'local', cfg: null,
  init() {
    const a = LS.get('sj4:api'), c = LS.get('sj4:supa');

    else if (c && c.url && c.key) { this.mode = 'supa'; this.cfg = c; }

    else this.mode = 'local';
  },
  async api(body) {
    const r = await fetch(this.cfg.url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-SJ-Key': this.cfg.key }, body: JSON.stringify(body), cache: 'no-store' });
    if (r.status === 401) throw new Error('auth');
    if (!r.ok) throw new Error('api ' + r.status);
    return r.json();
  },
  hd() { return supaHd(this.cfg.key, { 'Content-Type': 'application/json' }); },
  base() { return this.cfg.url.replace(/\/+$/, '') + '/rest/v1/sj_store'; },
  async get(k) {
    if (this.mode === 'local') return LS.get('sj4:' + k);
    if (this.mode === 'api') return (await this.api({ action: 'get', key: k })).value;
    if (this.mode === 'claude') { try { const r = await window.storage.get('sj4:' + k, true); return r ? JSON.parse(r.value) : null; } catch (e) { return null; } }
    const r = await fetch(this.base() + '?select=value&key=eq.' + encodeURIComponent(k), { headers: this.hd() });
    if (!r.ok) throw new Error('get ' + r.status);
    const j = await r.json(); return j[0] ? j[0].value : null;
  },
  async getMany(keys) {
    if (this.mode === 'api') return (await this.api({ action: 'getMany', keys })).values || {};
    if (this.mode !== 'supa') { const o = {}; for (const k of keys) o[k] = await this.get(k); return o; }
    const list = '(' + keys.map(k => '"' + k + '"').join(',') + ')';
    const r = await fetch(this.base() + '?select=key,value&key=in.' + encodeURIComponent(list), { headers: this.hd() });
    if (!r.ok) throw new Error('getMany ' + r.status);
    const o = {}; (await r.json()).forEach(x => o[x.key] = x.value); return o;
  },
  async set(k, v) {

/* =========================================================
   QUICK PARSE  (@Nom #event demain 20.10)
   ========================================================= */
function parseQuick(txt) {
  let who = null, due = '', evId = null; let s = ' ' + txt + ' ';
  const also = [];
  s = s.replace(/\s@([\p{L}-]+)/gu, (m, n) => { const mm = members().find(x => norm(x.name).startsWith(norm(n))); if (!mm) return m; if (!who) who = mm.name; else if (mm.name !== who && !also.includes(mm.name)) also.push(mm.name); return ' '; });
  s = s.replace(/\s#([\p{L}\d.-]+)/gu, (m, n) => { const e = live('events').slice().sort((a, b) => b.date.localeCompare(a.date)).find(x => norm(x.name).replace(/[^a-z0-9.]/g, '').includes(norm(n).replace(/[^a-z0-9.]/g, ''))); if (e && !evId) { evId = e.id; return ' '; } return m; });
  const t = today();
  s = s.replace(/\s(aujourd['’]hui|auj)(?=\s)/i, () => { due = t; return ' '; });
  s = s.replace(/\s(demain)(?=\s)/i, () => { due = addD(t, 1); return ' '; });
  const days = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  s = s.replace(/\s(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)(?=\s)/i, (m, dn) => { const tg = days.indexOf(dn.toLowerCase()); const cur = pd(t).getDay(); due = addD(t, ((tg - cur + 7) % 7) || 7); return ' '; });
  s = s.replace(/\s(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?=\s)/, (m, dd, mo, yy) => {
    if (+mo < 1 || +mo > 12 || +dd < 1 || +dd > 31) return m;
    let y = yy ? (yy.length === 2 ? 2000 + +yy : +yy) : pd(t).getFullYear();
    let c = `${y}-${pad(mo)}-${pad(dd)}`; if (!yy && c < t) c = `${y + 1}-${pad(mo)}-${pad(dd)}`;
    due = c; return ' ';
  });
  return { title: s.replace(/\s+/g, ' ').replace(/\s+(et|,|&)\s*$/i, '').trim(), who, also, due, evId };
}
function parsePreview(p) {
  const out = [];
  if (p.who) [p.who, ...(p.also || [])].forEach(n => out.push(`<span class="tag">${av(n, 's')} ${esc(n)}</span>`));
  if (p.due) out.push(`<span class="tag">${ic('clock', 12)} ${fS(p.due)}</span>`);
  if (p.evId) { const e = ev(p.evId); if (e) out.push(`<span class="tag" style="background:${rgba(evColor(e), .14)};color:${softText(evColor(e))}">${esc(e.name)}</span>`); }
  return out.join('');
}

function lintHtml(t) { const w = lint(t); if (!t) return ''; return w.length ? w.map(x => `<span>${esc(x)}</span>`).join('') : '<span class="ok">Ton OK</span>'; }
async function handleImg(file) {
  if (!file || !file.type.startsWith('image/')) return toast('Image uniquement');
  try {
    const url = await compress(file);
    pendingImg = url; pendingImgDel = false;
    const drop = $('#drop'); if (!drop) return;
    drop.innerHTML = `<img src="${url}" alt=""><div class="drop-acts"><button data-a="pick-img">Remplacer</button><button data-a="rm-img">Retirer</button></div>`;
  } catch (e) { toast('Image illisible'); }
}
function compress(file, max = 1080, q = .82) {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = rej;
    r.onload = ev2 => { const img = new Image(); img.onerror = rej; img.onload = () => { let { width: w, height: h } = img; if (w > max || h > max) { const k = Math.min(max / w, max / h); w = Math.round(w * k); h = Math.round(h * k); } const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h); res(cv.toDataURL('image/jpeg', q)); }; img.src = ev2.target.result; };
    r.readAsDataURL(file);
  });
}

let palSel = 0, palItems = [];
function openPalette() {
  $('#pal-root').innerHTML = `<div class="pal" data-pal-bg><div class="pal-box"><div class="pal-in">${ic('search', 18)}<input id="pal-q" placeholder="Chercher un event, une tâche, un sponsor, un PV... ou une action" autocomplete="off"><kbd>esc</kbd></div><div class="pal-res" id="pal-res"></div></div></div>`;
  palSel = 0; palRefresh(''); setTimeout(() => $('#pal-q').focus(), 20);
}
function closePalette() { $('#pal-root').innerHTML = ''; if (needsRender) render(); }
function palRefresh(q) {
  const n = norm(q), items = [];
  const acts = [
    ['Nouveau contenu', 'plus', () => mContent(null, {})], ['Nouvelle tâche', 'plus', () => mTask(null, {})], ['Nouvel event', 'plus', () => mEvent(null)],
    ['Nouveau sponsor', 'plus', () => mSponsor(null)], ['Nouvelle réunion', 'plus', () => { go('pv'); newPv(); }],
    ...NAV.filter(x => x.id).map(x => ['Aller à ' + x.l, x.ic, () => go(x.id)]), ['Aller à Réglages', 'sliders', () => go('settings')]
  ];
  acts.forEach(([l, i, fn]) => { if (!n || norm(l).includes(n)) items.push({ g: 'Actions', l, i, fn }); });
  if (n) {
    live('events').forEach(e => { if (norm(e.name + ' ' + e.location).includes(n)) items.push({ g: 'Events', l: e.name, s: fS(e.date), i: 'flag', fn: () => go('event', { evId: e.id }) }); });
    live('content').forEach(c => { if (norm(c.title + ' ' + c.caption).includes(n)) items.push({ g: 'Contenu', l: c.title, s: fS(c.date), i: 'image', fn: () => mContent(c.id) }); });
    live('tasks').forEach(x => { if (norm(x.title + ' ' + (x.who || '')).includes(n)) items.push({ g: 'Tâches', l: x.title, s: x.who || '', i: 'check', fn: () => mTask(x.id) }); });
    live('sponsors').forEach(s => { if (norm(s.name + ' ' + s.contribution + ' ' + s.contact + ' ' + (s.ref || '')).includes(n)) items.push({ g: 'Sponsors', l: s.name, s: statL(SSTAT, s.status), i: 'award', fn: () => mSponsor(s.id) }); });
    live('pvs').forEach(p => { if (norm(p.title + ' ' + p.body).includes(n)) items.push({ g: 'Réunions', l: p.title, s: fS(p.date), i: 'doc', fn: () => openPv(p.id) }); });
  }
  palItems = items.slice(0, 40); palSel = Math.min(palSel, Math.max(0, palItems.length - 1));
  let g = '', h = '';
  palItems.forEach((it, i) => { if (it.g !== g) { g = it.g; h += `<div class="pal-g">${g}</div>`; } h += `<div class="pal-i ${i === palSel ? 'on' : ''}" data-pi="${i}"><span class="pal-ic">${ic(it.i, 15)}</span>${esc(it.l)}${it.s ? `<small>${esc(it.s)}</small>` : ''}</div>`; });
  $('#pal-res').innerHTML = h || '<div class="empty">Aucun résultat</div>';
  const on = $('#pal-res .pal-i.on'); if (on) on.scrollIntoView({ block: 'nearest' });
}

function genPlan(id) {
  const e = ev(id); if (!e) return;
  const win = e.win || 45, base = S().planBase || 45, now = Date.now();
  const old = live('content').filter(c => c.eventId === id && c.auto), oldIds = old.map(c => c.id);
  old.forEach(c => { c._del = 1; c.u = now; });
  const newIds = [];
  (S().plan || []).forEach(r => {
    let d = r.d;
    if (d < -21) d = win > 21 ? Math.round(-21 + (d + 21) * (win - 21) / Math.max(1, base - 21)) : -win;
    d = Math.max(d, -Math.max(win, 1));
    const nid = uid('ct'); newIds.push(nid);
    D.content.push({ id: nid, title: r.t, eventId: id, ch: r.ch, date: addD(e.date, d), time: '', status: 'idee', who: null, caption: '', canva: '', pinned: false, hasImg: false, notes: '', auto: true, u: now });
  });
  touch('content'); render();
  toast(`Plan de communication généré : ${plural(newIds.length, 'contenu')}`, { action: 'Annuler', ms: 15000, fn: () => {
    const t2 = Date.now();
    D.content.forEach(c => { if (newIds.includes(c.id)) { c._del = 1; c.u = t2; } if (oldIds.includes(c.id)) { delete c._del; c.u = t2; } });
    touch('content'); render(); toast('Plan annulé');
  } });
}
function genTasks(id) {
  const e = ev(id); if (!e) return;
  const now = Date.now(), t = today();
  const old = live('tasks').filter(x => x.eventId === id && x.auto && x.status !== 'done'), oldIds = old.map(x => x.id);
  old.forEach(x => { x._del = 1; x.u = now; });
  const newIds = [];
  const rows = [...(S().taskPlan || [])]; tBase(e.type).tk.forEach(r => { if (!rows.some(x => norm(x.t) === norm(r.t))) rows.push(r); });
  rows.forEach(r => {
    let due = addD(e.date, r.d); if (due < t) { if (e.date < t) return; due = t; }
    const nid = uid('tk'); newIds.push(nid);
    D.tasks.push({ id: nid, title: r.t, who: members().some(m => m.name === r.who) ? r.who : null, due, status: 'todo', eventId: id, notes: '', auto: true, u: now });
  });
  if (!newIds.length) { old.forEach(x => { delete x._del; }); return toast('Event passé, rien à générer'); }
  touch('tasks'); render();
  toast(`${plural(newIds.length, 'tâche générée', 'tâches générées')}`, { action: 'Annuler', ms: 15000, fn: () => {
    const t2 = Date.now();
    D.tasks.forEach(x => { if (newIds.includes(x.id)) { x._del = 1; x.u = t2; } if (oldIds.includes(x.id)) { delete x._del; x.u = t2; } });
    touch('tasks'); render(); toast('Tâches annulées');
  } });
}
function delPlan(id) {
  const list = live('content').filter(c => c.eventId === id && c.auto); if (!list.length) return;
  const snap = list.map(c => c.id);
  list.forEach(c => { c._del = 1; c.u = Date.now(); }); touch('content'); render();
  toast(`${plural(list.length, 'contenu auto supprimé', 'contenus auto supprimés')}`, { action: 'Annuler', ms: 15000, fn: () => { D.content.filter(c => snap.includes(c.id)).forEach(c => { delete c._del; c.u = Date.now(); }); touch('content'); render(); } });
}

function toggleTask(id, shift) {
  const t = live('tasks').find(x => x.id === id); if (!t) return;
  const prev = t.status;
  const next = shift ? (t.status === 'doing' ? 'todo' : 'doing') : (t.status === 'done' ? 'todo' : 'done');
  patch('tasks', id, { status: next });
  if (UI.view === 'pv' && UI.pv) { const el = $(`[data-a="tk-toggle"][data-id="${id}"]`); if (el) el.className = 'ck ' + (next === 'done' ? 'on' : next === 'doing' ? 'half' : ''); renderSide(); return; }
  render();

}

async function importJson(file) {
  try {
    const j = JSON.parse(await file.text());
    let data = j;
    if (j.version === 3 || (j.events && j.events[0] && j.events[0].event_family)) data = { ...convertV3(j), images: j.images };
    if (Array.isArray(j) && j[0] && j[0].date && j[0].label) data = { externals: j };
    let added = 0;
    COLLS.forEach(k => { if (Array.isArray(data[k])) { const before = live(k).length; const now = Date.now(); D[k] = mergeById(D[k], data[k].map(r => ({ ...r, id: r.id || uid('x'), u: now }))); added += live(k).length - before; touch(k); } });
    if (data.settings && j.version >= 4) { D.settings = fixSettings({ ...data.settings, u: Date.now() }); touch('settings'); }
    if (data.images) for (const [id, url] of Object.entries(data.images)) { try { await setImg(id, url); } catch (e) {} }
    toast(added ? `Import terminé, ${plural(added, 'élément ajouté', 'éléments ajoutés')}` : 'Import terminé'); render();
  } catch (e) { console.warn(e); toast('Fichier illisible'); }
}

document.addEventListener('input', e => {

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#pal-root').children.length ? closePalette() : openPalette(); return; }

    if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); palRefresh($('#pal-q').value); }
    if (e.key === 'Enter') { e.preventDefault(); palRun(palSel); }
    return;
  }
  if (e.key === 'Escape') { if ($('#menu-root').children.length) return closeMenu(); if ($('#modal-root').children.length) return closeModal(); }
  const el = e.target;
  if (e.key === 'Enter' && el.dataset) {
    if (el.dataset.k === 'quick-task') { e.preventDefault(); quickTask(el); }
    else if (el.dataset.k === 'base-add') { e.preventDefault(); const v = el.value.trim(); if (!v) return; const ty = mState.baseType; const m = v.match(/^J\s*([+-]?\d+)\s+(.+)$/i); if (m) { const p = parseQuick(m[2]); setBase(ty, b => b.tk.push({ d: +m[1] || 0, who: p.who || null, t: p.title })); } else setBase(ty, b => b.cl.push(v)); mBase(ty); render(); setTimeout(() => { const n = $('[data-k="base-add"]'); if (n) n.focus(); }, 30); }
    else if (el.dataset.k === 'ds-add') { e.preventDefault(); const v = el.value.trim(); if (!v) return; const evx = ev(el.dataset.id); const m = v.match(/^([^:]{2,30})\s:\s(.+)$/); const ds = evx.discuss || []; ds.push({ id: uid('ds'), th: m ? m[1].trim() : '', t: m ? m[2].trim() : v, done: false }); patch('events', evx.id, { discuss: ds }); render(); setTimeout(() => { const n = $(`[data-k="ds-add"]`); if (n) n.focus(); }, 20); }
    else if (el.dataset.k === 'cl-add') { e.preventDefault(); const v = el.value.trim(); if (!v) return; const p = parseQuick(v); const evx = ev(el.dataset.id); const cl = evx.checklist || []; cl.push({ id: uid('cl'), t: p.title || v, done: false, who: p.who }); patch('events', evx.id, { checklist: cl }); render(); setTimeout(() => { const n = $(`[data-k="cl-add"]`); if (n) n.focus(); }, 20); }
    else if (el.dataset.k === 'pvt-add') { e.preventDefault(); ACT['pvt-add'](); }

  }

});

/* ---------- @ mentions ---------- */
const MN = { el: null, input: null, start: 0, list: [], i: 0 };
function caretXY(el, pos) {
  const cs = getComputedStyle(el), d = document.createElement('div');
  ['fontFamily', 'fontSize', 'fontWeight', 'lineHeight', 'letterSpacing', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'borderTopWidth', 'borderLeftWidth', 'boxSizing', 'textTransform', 'wordSpacing', 'tabSize'].forEach(k => d.style[k] = cs[k]);
  d.style.position = 'absolute'; d.style.visibility = 'hidden'; d.style.top = '0'; d.style.left = '-9999px';
  d.style.whiteSpace = el.tagName === 'TEXTAREA' ? 'pre-wrap' : 'pre'; d.style.wordWrap = 'break-word'; d.style.width = el.offsetWidth + 'px';
  d.textContent = el.value.slice(0, pos); const sp = document.createElement('span'); sp.textContent = '​'; d.appendChild(sp);
  document.body.appendChild(d); const r = el.getBoundingClientRect();
  const x = r.left + sp.offsetLeft - el.scrollLeft, y = r.top + sp.offsetTop - el.scrollTop + sp.offsetHeight;
  d.remove(); return { x: Math.min(x, window.innerWidth - 190), y: Math.min(y + 4, window.innerHeight - 40) };
}
function mnClose() { if (MN.el) MN.el.remove(); MN.el = null; MN.input = null; }
function mnRender() {
  if (!MN.el) { MN.el = document.createElement('div'); MN.el.className = 'mn-menu'; document.body.appendChild(MN.el); MN.el.addEventListener('mousedown', e => { const it = e.target.closest('.mn-i'); if (!it) return; e.preventDefault(); mnPick(+it.dataset.i); }); }
  MN.el.innerHTML = MN.list.map((m, i) => `<div class="mn-i ${i === MN.i ? 'on' : ''}" data-i="${i}">${av(m.name, 's')}${esc(m.name)}</div>`).join('');
  const p = caretXY(MN.input, MN.start); MN.el.style.left = p.x + 'px'; MN.el.style.top = p.y + 'px';
}
function mnPick(i) {
  const el = MN.input, m = MN.list[i]; if (!el || !m) return mnClose();
  const pos = el.selectionStart, v = el.value, ins = '@' + m.name + ' ';
  el.value = v.slice(0, MN.start) + ins + v.slice(pos); const np = MN.start + ins.length; el.setSelectionRange(np, np);
  mnClose(); el.dispatchEvent(new Event('input', { bubbles: true })); el.focus();
}
document.addEventListener('input', e => {
  const el = e.target; if (!el || !(el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && /^(text|search|)$/.test(el.type)))) return;
  if (el.closest('.set-row') || el.closest('#pal-root')) return;
  const pos = el.selectionStart, before = el.value.slice(0, pos), m = before.match(/(^|[\s(])@([\p{L}-]*)$/u);
  if (!m) { if (MN.input === el) mnClose(); return; }
  const q = norm(m[2]), list = members().filter(x => norm(x.name).startsWith(q) && norm(x.name) !== q);
  if (!list.length) { mnClose(); return; }
  MN.input = el; MN.start = pos - m[2].length - 1; MN.list = list; MN.i = Math.min(MN.i, list.length - 1); if (MN.i < 0) MN.i = 0;
  mnRender();
}, true);
document.addEventListener('keydown', e => {
  if (!MN.el || e.target !== MN.input) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); e.stopImmediatePropagation(); MN.i = (MN.i + (e.key === 'ArrowDown' ? 1 : -1) + MN.list.length) % MN.list.length; mnRender(); }
  else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); e.stopImmediatePropagation(); mnPick(MN.i); }
  else if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); mnClose(); }
}, true);
document.addEventListener('focusout', e => { if (e.target === MN.input) setTimeout(() => { if (document.activeElement !== MN.input) mnClose(); }, 120); }, true);
window.addEventListener('scroll', () => mnClose(), true);

async function boot() {
  Store.init();
  UI.me = LS.get('sj4:me') || null;
  if (Store.mode !== 'local') {
    COLLS.forEach(k => { const c = LS.get('sj4c:' + k); if (c) D[k] = c; });
    const cs = LS.get('sj4c:settings'); if (cs) D.settings = fixSettings(cs);
    if (D.events.length) render();
  } else {
    // local mode: Store reads localStorage directly in pullAll
  }
  await pullAll();
  render();
  setInterval(() => { if (document.visibilityState === 'visible') pullAll(); }, 20000);
  window.addEventListener('focus', () => pullAll());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
}
boot();
})();
